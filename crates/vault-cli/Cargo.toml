[package]
name = "vault-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
vault-core = { path = "../vault-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rpassword = "7"
keyring = "2"
zeroize = "1"
