name: Feature request
description: Suggest something Vault-R should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation you are in, not just the feature you have in
        mind. The underlying problem often has a better solution than the one
        that first comes to mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part would this affect?
      options:
        - Desktop app (GUI)
        - CLI (`vault`)
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
