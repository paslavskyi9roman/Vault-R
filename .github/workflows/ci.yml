name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes anything back to the repository, and this one holds the
# token that could.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri needs these to build the GUI crate; vault-core and vault-cli
      # do not, but the workspace is built as a whole.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Third-party actions are pinned by commit, not by tag: a tag can be
      # moved onto new code, and these run with the repository checked out.
      # Dependabot bumps them (see .github/dependabot.yml).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The git leak-guard tests shell out to a real git binary; it is present
      # on GitHub runners, and the tests set their own identity per temp repo.
      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
